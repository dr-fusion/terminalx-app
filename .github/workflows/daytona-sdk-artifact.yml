name: Pinned Daytona SDK, runtime, and TerminalX supervisor artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out TerminalX
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Load the canonical Daytona production source pin
        id: daytona-source
        run: node scripts/read-daytona-production-source.mjs github-output >>"$GITHUB_OUTPUT"

      - name: Check out the exact production Daytona fork commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.daytona-source.outputs.fork_repository }}
          ref: ${{ steps.daytona-source.outputs.production_fork_commit }}
          path: .daytona-source
          persist-credentials: false
          fetch-depth: 0

      - name: Check out an independent exact Daytona rebuild source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.daytona-source.outputs.fork_repository }}
          ref: ${{ steps.daytona-source.outputs.production_fork_commit }}
          path: .daytona-source-rebuild
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact production fork ancestry
        env:
          DAYTONA_UPSTREAM_BASE_COMMIT: ${{ steps.daytona-source.outputs.upstream_base_commit }}
          DAYTONA_PRODUCTION_FORK_COMMIT: ${{ steps.daytona-source.outputs.production_fork_commit }}
        run: |
          test "$(git -C .daytona-source rev-parse HEAD)" = "$DAYTONA_PRODUCTION_FORK_COMMIT"
          test "$DAYTONA_PRODUCTION_FORK_COMMIT" != "$DAYTONA_UPSTREAM_BASE_COMMIT"
          git -C .daytona-source merge-base --is-ancestor "$DAYTONA_UPSTREAM_BASE_COMMIT" "$DAYTONA_PRODUCTION_FORK_COMMIT"

      - name: Install pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .daytona-source/apps/runner/go.mod
          cache-dependency-path: |
            .daytona-source/apps/runner/go.sum
            .daytona-source/apps/daemon/go.sum
            .daytona-source/go.work.sum

      - name: Install exact TerminalX build dependencies
        run: npm ci --ignore-scripts

      - name: Build the pinned SDK bundle
        run: scripts/build-pinned-daytona-sdk.sh "$GITHUB_WORKSPACE/.daytona-source" "$RUNNER_TEMP/daytona-sdk"

      - name: Build the pinned hardened runner and daemon
        run: scripts/build-pinned-daytona-runtime.sh "$GITHUB_WORKSPACE/.daytona-source" "$RUNNER_TEMP/daytona-runtime"

      - name: Build the pinned TerminalX supervisor bundle
        run: scripts/build-pinned-daytona-supervisor.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/daytona-supervisor"

      - name: Rebuild and verify deterministic release inputs
        run: |
          scripts/build-pinned-daytona-sdk.sh "$GITHUB_WORKSPACE/.daytona-source-rebuild" "$RUNNER_TEMP/daytona-sdk-rebuild"
          scripts/build-pinned-daytona-runtime.sh "$GITHUB_WORKSPACE/.daytona-source-rebuild" "$RUNNER_TEMP/daytona-runtime-rebuild"
          scripts/build-pinned-daytona-supervisor.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/daytona-supervisor-rebuild"
          diff --no-dereference --recursive "$RUNNER_TEMP/daytona-sdk" "$RUNNER_TEMP/daytona-sdk-rebuild"
          diff --no-dereference --recursive "$RUNNER_TEMP/daytona-runtime" "$RUNNER_TEMP/daytona-runtime-rebuild"
          diff --no-dereference --recursive "$RUNNER_TEMP/daytona-supervisor" "$RUNNER_TEMP/daytona-supervisor-rebuild"

      - name: Generate SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/daytona-sdk
          format: spdx-json
          output-file: ${{ runner.temp }}/daytona-sdk/daytona-sdk.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate supervisor SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/daytona-supervisor
          format: spdx-json
          output-file: ${{ runner.temp }}/daytona-supervisor/daytona-supervisor.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate hardened runtime SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/daytona-runtime
          format: spdx-json
          output-file: ${{ runner.temp }}/daytona-runtime/daytona-runtime.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record final artifact checksums
        run: |
          cd "$RUNNER_TEMP/daytona-sdk"
          sha256sum daytona-sdk.spdx.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Record final supervisor artifact checksums
        run: |
          cd "$RUNNER_TEMP/daytona-supervisor"
          sha256sum daytona-supervisor.spdx.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Record final hardened runtime checksums
        run: |
          cd "$RUNNER_TEMP/daytona-runtime"
          sha256sum daytona-runtime.spdx.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Attest exact build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/daytona-sdk/checksums.sha256

      - name: Attest exact supervisor build provenance
        id: supervisor-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/daytona-supervisor/checksums.sha256

      - name: Attest exact hardened runtime build provenance
        id: runtime-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/daytona-runtime/checksums.sha256

      - name: Include the signed provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/daytona-sdk/daytona-sdk.provenance.json"
          cd "$RUNNER_TEMP/daytona-sdk"
          sha256sum daytona-sdk.provenance.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Include the signed supervisor provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.supervisor-provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/daytona-supervisor/daytona-supervisor.provenance.json"
          cd "$RUNNER_TEMP/daytona-supervisor"
          sha256sum daytona-supervisor.provenance.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Include the signed hardened runtime provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.runtime-provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/daytona-runtime/daytona-runtime.provenance.json"
          cd "$RUNNER_TEMP/daytona-runtime"
          sha256sum daytona-runtime.provenance.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Upload release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daytona-sdk-${{ steps.daytona-source.outputs.production_fork_commit }}-${{ github.sha }}
          path: ${{ runner.temp }}/daytona-sdk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload supervisor release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminalx-daytona-supervisor-${{ github.sha }}
          path: ${{ runner.temp }}/daytona-supervisor
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload hardened runtime release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminalx-daytona-runtime-${{ steps.daytona-source.outputs.production_fork_commit }}-${{ github.sha }}
          path: ${{ runner.temp }}/daytona-runtime
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
