name: Pinned Daytona SDK artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TerminalX
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the exact public Daytona fork commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: procyon-labs-io/daytona
          ref: b5a5d9e78d76c8bcf351f2049620250e0f34eea4
          path: .daytona-source
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Build the pinned SDK bundle
        run: scripts/build-pinned-daytona-sdk.sh "$GITHUB_WORKSPACE/.daytona-source" "$RUNNER_TEMP/daytona-sdk"

      - name: Generate SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/daytona-sdk
          format: spdx-json
          output-file: ${{ runner.temp }}/daytona-sdk/daytona-sdk.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record final artifact checksums
        run: |
          cd "$RUNNER_TEMP/daytona-sdk"
          sha256sum daytona-sdk.spdx.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Attest exact build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/daytona-sdk/checksums.sha256

      - name: Include the signed provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/daytona-sdk/daytona-sdk.provenance.json"
          cd "$RUNNER_TEMP/daytona-sdk"
          sha256sum daytona-sdk.provenance.json >>checksums.sha256
          sha256sum --check checksums.sha256

      - name: Upload release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daytona-sdk-b5a5d9e-${{ github.sha }}
          path: ${{ runner.temp }}/daytona-sdk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
