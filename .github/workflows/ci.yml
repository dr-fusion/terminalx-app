name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run --reporter=verbose

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    env:
      TERMINALX_AUTH_MODE: none
      TERMINALX_ALLOW_AUTH_NONE: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - run: npm ci
      - run: npm run build

      - name: Start server and run smoke tests
        run: |
          # Start the server in background with no auth for smoke testing
          NODE_ENV=production npx tsx server/index.ts &
          SERVER_PID=$!

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

          # Smoke test 1: Health endpoint returns 200
          echo "Test 1: Health endpoint"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Health endpoint returned $STATUS"
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          echo "PASS: Health endpoint returned 200"

          # Smoke test 2: Login endpoint exists (returns 400 since auth is disabled)
          echo "Test 2: Login endpoint"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' \
            http://localhost:3000/api/auth/login)
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: Login endpoint returned $STATUS (expected 400 with auth=none)"
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          echo "PASS: Login endpoint returned 400 (auth disabled)"

          # Smoke test 3: Sessions API works
          echo "Test 3: Sessions API"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/sessions)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Sessions API returned $STATUS"
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          echo "PASS: Sessions API returned 200"

          echo "All smoke tests passed"
          kill $SERVER_PID 2>/dev/null

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
